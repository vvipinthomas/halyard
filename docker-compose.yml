# Local run:  cp .env.example .env  (set ENCRYPTION_KEY)  →  docker compose up --build
services:
  halyard:
    build: .
    image: halyard:local
    ports: ["8787:8787"]
    env_file: .env
    environment:
      # Lets the server reach Ollama/LM Studio/local MCP servers on your machine.
      ALLOW_PRIVATE_NETWORK: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["halyard-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
  # Optional local models:  docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    environment:
      OLLAMA_ORIGINS: "http://localhost:8787"
    volumes: ["ollama-models:/root/.ollama"]
volumes:
  halyard-data:
  ollama-models:
