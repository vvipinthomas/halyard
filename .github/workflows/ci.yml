name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t halyard:ci .
      - run: |
          docker run -d --name hy -p 8787:8787 -e ENCRYPTION_KEY=$(openssl rand -base64 32) halyard:ci
          for i in $(seq 1 20); do curl -fs localhost:8787/api/health && exit 0; sleep 1; done; docker logs hy; exit 1
